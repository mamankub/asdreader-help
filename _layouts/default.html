<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">ข้ามไปที่เนื้อหา</a>
  <header class="top">
    <a class="brand" href="{{ '/' | relative_url }}">ASDReader</a>
    <nav aria-label="เมนูหลัก">
      <a href="{{ '/download/' | relative_url }}"{% if page.url contains '/download/' %} aria-current="page"{% endif %}>ดาวน์โหลด</a>
      <a href="{{ '/manual/' | relative_url }}"{% if page.url contains '/manual/' %} aria-current="page"{% endif %}>คู่มือ</a>
      <a href="{{ '/support/' | relative_url }}"{% if page.url contains '/support/' %} aria-current="page"{% endif %}>ช่วยเหลือ</a>
      <a href="{{ '/changelog/' | relative_url }}"{% if page.url contains '/changelog/' %} aria-current="page"{% endif %}>มีอะไรใหม่</a>
    </nav>
  </header>
  <main id="content">
{{ content }}
  </main>
  <footer>
    <p>ASDReader · <a href="https://github.com/mamankub/asdreader-help">GitHub</a> ·
      <a href="https://github.com/mamankub/asdreader-help/issues">แจ้งปัญหา</a></p>
  </footer>
</body>
</html>
