name: แจ้งปัญหา
description: โปรแกรมทำงานไม่ถูกต้อง ปิดเอง หรือแสดงผลผิด
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **อย่าแนบเอกสารที่มีข้อมูลส่วนตัวหรือข้อมูลลับ** ข้อมูลในหน้านี้ทุกคนอ่านได้
  - type: input
    id: version
    attributes:
      label: รุ่นของ ASDReader
      description: ดูได้ที่ วิธีใช้ ▸ เกี่ยวกับ
      placeholder: v0.13.3
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: ระบบปฏิบัติการ
      placeholder: Windows 11 64 บิต
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: ขั้นตอนที่ทำให้เกิดปัญหา
      placeholder: |
        1. เปิดไฟล์ ...
        2. เลือก แก้ไข PDF แล้ว ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ผลที่คาดไว้ และผลที่เกิดขึ้นจริง
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: ภาพหน้าจอ ข้อความแจ้งเตือน หรือไฟล์ log
      description: ไฟล์ log อยู่ในโฟลเดอร์ logs ของ %APPDATA%\ASDReader
