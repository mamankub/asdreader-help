name: Self-hosted Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.repository_owner == 'mamankub' && github.actor == 'mamankub' }}
    runs-on: [self-hosted, Linux, X64, asd-ci, ubuntu-24.04]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    if: ${{ github.repository_owner == 'mamankub' && github.actor == 'mamankub' }}
    needs: build
    runs-on: [self-hosted, Linux, X64, asd-ci, ubuntu-24.04]
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
